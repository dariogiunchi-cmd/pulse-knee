# PULSE — la raccolta notturna delle fonti esterne.
#
# Il sandbox delle sessioni Claude non esce su internet; questi runner sì. Alle 1.40/2.15
# UTC lo script interroga le API ufficiali (openFDA, ClinicalTrials.gov, Crossref,
# feed YouTube, Swissmedic) e deposita fonti/raccolta.json nel repository: la sessione
# del briefing delle 5.00 lo trova come file locale. Nessuno scraping di piattaforme
# che lo vietano: API e feed pubblici, e ogni fonte che non risponde viene dichiarata.
#
# Lanciato a mano (workflow_dispatch) accetta scopri=true per la modalità di scoperta
# (risoluzione di feed Swissmedic e canali YouTube candidati) e spinge sul ramo da cui
# è stato lanciato: così la configurazione si mette a punto senza toccare main.
name: raccolta

on:
  schedule:
    # Doppia corsa: il cron di GitHub è dichiaratamente «best effort» e la notte del
    # 19 agosto la corsa unica delle 4:15 non è partita (segnalato dal briefing).
    # Due appuntamenti distinti dimezzano la probabilità del buco; lo script
    # committa solo se qualcosa è cambiato, quindi la doppia corsa non sporca.
    #
    # Spostati alle 1:40/2:15 UTC il 16 settembre 2026: con gli orari originali
    # (3:40/4:15) la corsa arrivava sistematicamente a fine corsa fra le 8:58 e le
    # 9:35 UTC — ore DOPO la sessione delle 5:00, non prima — per il ritardo «best
    # effort» del cron di GitHub Actions sotto carico. Il sintomo: dodici mattine
    # di fila con NONVERIF che dichiarava il raccoglitore «non passato», quando in
    # realtà aveva funzionato, solo troppo tardi per la finestra utile. Anticipare
    # l'orario dichiarato non elimina il ritardo della piattaforma, ma allarga il
    # margine prima delle 5:00: se il sintomo si ripresenta, è di nuovo un limite
    # noto di GitHub Actions da segnalare, non un guasto da rincorrere ogni giorno.
    - cron: '40 1 * * *'
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      scopri:
        description: 'Modalità scoperta (risolve feed e canali candidati)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  raccogli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: raccolta
        run: |
          if [ "${{ github.event.inputs.scopri }}" = "true" ]; then
            python3 test/raccolta.py --scopri
          else
            python3 test/raccolta.py
          fi
      - name: deposito nel repository
        run: |
          git config user.name "PULSE raccolta"
          git config user.email "noreply@anthropic.com"
          git add fonti/raccolta.json
          if git diff --cached --quiet; then
            echo "nessuna novità dalle fonti"
          else
            git commit -m "raccolta notturna $(date -u +%F)"
            git push origin HEAD:${{ github.ref_name }}
          fi
