# PULSE — prova d'ascolto comparativa (Addendum §12, punto 16.5).
# Genera TRE versioni audio dello stesso briefing reale (audio/briefing-orecchio.txt)
# con tre motori diversi, senza chiavi e senza sottoscrizioni:
#   azure  — voce neurale Azure (it-IT-Isabella) via endpoint pubblico edge-tts:
#            ANTEPRIMA della qualità Azure; in produzione si userebbe l'API
#            ufficiale (livello gratuito F0, 500k caratteri/mese)
#   piper  — Piper, motore locale open-source (voce it_IT paola medium)
#   kokoro — Kokoro 82M, motore locale open-source (voce if_sara)
# I file finiscono in audio/prova/ sul ramo che lancia il workflow. Un solo scopo:
# far scegliere all'utente PER ASCOLTO, alla cieca. Nessun dato di paziente.
name: prova-ascolto
on:
  workflow_dispatch:
  push:
    branches: [rifondazione/v3]
    paths: ['audio/richiesta-prova.txt']

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: dipendenze
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip -q install edge-tts piper-tts soundfile kokoro

      - name: azure (anteprima via edge-tts)
        run: |
          mkdir -p audio/prova
          edge-tts --voice it-IT-IsabellaNeural \
            --file audio/briefing-orecchio.txt \
            --write-media audio/prova/azure.mp3

      - name: piper
        run: |
          curl -sSL -o paola.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx"
          curl -sSL -o paola.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx.json"
          python3 -m piper --model paola.onnx --output_file piper.wav < audio/briefing-orecchio.txt
          ffmpeg -loglevel error -y -i piper.wav -b:a 96k audio/prova/piper.mp3

      - name: kokoro
        run: |
          python3 - <<'EOF'
          from kokoro import KPipeline
          import soundfile as sf
          import numpy as np
          testo = open('audio/briefing-orecchio.txt', encoding='utf-8').read()
          pipe = KPipeline(lang_code='i')
          pezzi = [audio for (_, _, audio) in pipe(testo, voice='if_sara')]
          sf.write('kokoro.wav', np.concatenate(pezzi), 24000)
          EOF
          ffmpeg -loglevel error -y -i kokoro.wav -b:a 96k audio/prova/kokoro.mp3

      - name: commit dei campioni
        run: |
          git config user.name "pulse-prova-ascolto"
          git config user.email "actions@github.com"
          git add audio/prova/*.mp3
          git commit -m "prova d'ascolto: tre motori sullo stesso briefing reale"
          git push
