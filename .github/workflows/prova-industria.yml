# PULSE — collaudo una tantum del modulo industria (Addendum 4 §5 e §8.1).
# Esegue il raccoglitore col modulo nuovo e verifica empiricamente che le fonti
# configurate coprano una notizia di mercato nota (la vicenda DePuy Synthes / J&J).
name: prova-industria
on:
  push:
    branches: [rifondazione/v3]
    paths: ['fonti/prova-industria.txt']

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: raccolta col modulo industria
        run: python3 test/raccolta.py
      - name: esito industria
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('fonti/raccolta.json'))
          ind=r['fonti']['industria']
          print('esito:',ind['esito'])
          d=ind.get('dati') or {}
          for c in d.get('canali',[]): print(' canale:',c)
          for v in d.get('voci',[])[:15]: print(' voce:',v['fonte'],'·',v['titolo'][:90])
          PY
      - name: prova di copertura (§8.1) — DePuy Synthes sulla stampa configurata
        run: |
          python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request('https://www.massdevice.com/?s=depuy+synthes',
              headers={'User-Agent':'PULSE-prova/1.0'})
          h=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace').lower()
          trovato='depuy' in h and ('sale' in h or 'sell' in h or 'divest' in h or 'orthopaedics' in h or 'orthopedics' in h)
          print('massdevice copre DePuy Synthes:',trovato)
          assert 'depuy' in h, 'la fonte non copre nemmeno il nome'
          PY
      - name: deposito
        run: |
          git config user.name "pulse-prova"
          git config user.email "actions@github.com"
          git add fonti/raccolta.json
          git diff --cached --quiet || git commit -m "prova industria: raccolta col modulo nuovo"
          git push
